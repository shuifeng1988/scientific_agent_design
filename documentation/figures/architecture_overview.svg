<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}
      .label{font:700 18px Arial,sans-serif;fill:#0f172a}
      .small{font:14px Arial,sans-serif;fill:#334155}
      .node{stroke:#2563eb;stroke-width:2;rx:16}
      .data{fill:#dcfce7;stroke:#16a34a}
      .control{fill:#dbeafe}
      .compute{fill:#ede9fe;stroke:#7c3aed}
      .evidence{fill:#fef9c3;stroke:#ca8a04}
      .arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="title">Auditable Scientific Research Agent</text>
  <rect x="40" y="100" width="210" height="120" class="node control"/>
  <text x="145" y="145" text-anchor="middle" class="label">User intent</text>
  <text x="145" y="175" text-anchor="middle" class="small">goal · hypotheses</text>
  <text x="145" y="198" text-anchor="middle" class="small">scope · decisions</text>

  <rect x="335" y="80" width="265" height="160" class="node compute"/>
  <text x="468" y="125" text-anchor="middle" class="label">Supervisor Agent</text>
  <text x="468" y="155" text-anchor="middle" class="small">intake · plan · execute</text>
  <text x="468" y="178" text-anchor="middle" class="small">review · reflect</text>
  <text x="468" y="201" text-anchor="middle" class="small">guarded decisions</text>

  <rect x="690" y="70" width="220" height="75" class="node data"/>
  <text x="800" y="113" text-anchor="middle" class="label">Five root documents</text>
  <text x="800" y="135" text-anchor="middle" class="small">project · plan · software · data · status</text>
  <rect x="690" y="170" width="220" height="75" class="node data"/>
  <text x="800" y="213" text-anchor="middle" class="label">Registry + events</text>
  <text x="800" y="235" text-anchor="middle" class="small">tasks · hashes · provenance</text>

  <rect x="965" y="90" width="190" height="110" class="node compute"/>
  <text x="1060" y="135" text-anchor="middle" class="label">H100 / V100</text>
  <text x="1060" y="165" text-anchor="middle" class="small">remote execution</text>
  <text x="1060" y="187" text-anchor="middle" class="small">environment + GPU evidence</text>

  <rect x="335" y="365" width="265" height="145" class="node evidence"/>
  <text x="468" y="408" text-anchor="middle" class="label">QC + reflection</text>
  <text x="468" y="438" text-anchor="middle" class="small">expected vs observed</text>
  <text x="468" y="461" text-anchor="middle" class="small">anomalies + alternatives</text>
  <text x="468" y="484" text-anchor="middle" class="small">evidence strength</text>

  <rect x="690" y="350" width="220" height="165" class="node data"/>
  <text x="800" y="395" text-anchor="middle" class="label">Result package</text>
  <text x="800" y="425" text-anchor="middle" class="small">README + Word</text>
  <text x="800" y="448" text-anchor="middle" class="small">tables + figures</text>
  <text x="800" y="471" text-anchor="middle" class="small">QC + hashes + failures</text>

  <rect x="965" y="365" width="190" height="145" class="node evidence"/>
  <text x="1060" y="408" text-anchor="middle" class="label">Decision</text>
  <text x="1060" y="438" text-anchor="middle" class="small">freeze conclusion</text>
  <text x="1060" y="461" text-anchor="middle" class="small">ask user</text>
  <text x="1060" y="484" text-anchor="middle" class="small">add evidence task</text>

  <path d="M250 160 H335" class="arrow"/>
  <path d="M600 140 H690" class="arrow"/>
  <path d="M910 140 H965" class="arrow"/>
  <path d="M1060 200 V365" class="arrow"/>
  <path d="M800 245 V350" class="arrow"/>
  <path d="M690 432 H600" class="arrow"/>
  <path d="M335 438 H250 V220" class="arrow"/>
  <path d="M910 432 H965" class="arrow"/>
  <path d="M1060 510 V570 H468 V510" class="arrow"/>
</svg>
